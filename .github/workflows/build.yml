name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nlohmann-json3-dev librubberband-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev libgl1-mesa-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript qml6-module-qt-labs-folderlistmodel
      - run: cmake -S . -B build -G Ninja
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: brew install ninja pkg-config qt ffmpeg rubberband nlohmann-json
      - run: cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qtmultimedia'
          cache: true
      - name: vcpkg-Cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-ffmpeg-x64-windows-v1
      - name: FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vcpkg-cache | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "ffmpeg[core,avcodec,avformat,swscale,swresample]:x64-windows" "nlohmann-json:x64-windows"
      - name: Konfigurieren
        shell: pwsh
        run: cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
