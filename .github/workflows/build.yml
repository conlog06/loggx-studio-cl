name: Build

on:
  push:
  pull_request:

env:
  ORT_VERSION: "1.20.1"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nlohmann-json3-dev librubberband-dev gdb \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev libgl1-mesa-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript qml6-module-qt-labs-folderlistmodel librtmidi-dev
      - name: KI-Testdaten (Modell und Song) aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/ki-test
          key: ki-test-kuielab-vocals-v1
      - name: ONNX Runtime und KI-Testdaten
        run: |
          curl -sSL https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz | tar xz -C $HOME
          mkdir -p ~/ki-test
          [ -f ~/ki-test/kuielab_a_vocals.onnx ] || curl -sSL -o ~/ki-test/kuielab_a_vocals.onnx https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/kuielab_a_vocals.onnx
          [ -f ~/ki-test/song.mp3 ] || curl -sSL -o ~/ki-test/song.mp3 https://raw.githubusercontent.com/deezer/spleeter/master/audio_example.mp3
          ls -la ~/ki-test
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLOGGX_ONNXRUNTIME_DIR=$HOME/onnxruntime-linux-x64-${ORT_VERSION}
      - run: cmake --build build
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          LOGGX_TEST_MODEL_DIR: /home/runner/ki-test
        run: |
          ctest --test-dir build --output-on-failure && exit 0
          # Bei Absturz: Backtrace für die Fehlersuche
          for t in test_render test_mvp; do
            gdb -batch -ex run -ex "thread apply all bt 25" ./build/$t 2>&1 | tail -80 || true
          done
          exit 1

  # Engine-Tests im optimierten Build und mit Sanitizern (ohne Oberfläche).
  linux-checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            flags: ""
            type: Release
          - name: asan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
            type: RelWithDebInfo
          - name: tsan
            flags: "-fsanitize=thread"
            type: RelWithDebInfo
    name: linux-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nlohmann-json3-dev librubberband-dev gdb \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev
      - run: cmake -S . -B build -G Ninja -DLOGGX_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=${{ matrix.type }} "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
      - run: cmake --build build
      - name: Tests (dreimal, mit 1 und 8 Threads)
        env:
          ASAN_OPTIONS: detect_leaks=0
          TSAN_OPTIONS: "halt_on_error=1 suppressions=${{ github.workspace }}/tests/tsan.supp"
        run: |
          set -e
          for run in 1 2 3; do
            for threads in 1 8; do
              for t in test_core test_render test_mvp; do
                echo "== $t (Durchlauf $run, $threads Threads)"
                if ! LOGGX_THREADS=$threads ./build/$t; then
                  gdb -batch -ex "set env LOGGX_THREADS=$threads" -ex run -ex "thread apply all bt 25" ./build/$t 2>&1 | tail -80 || true
                  exit 1
                fi
              done
            done
          done

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: brew install ninja pkg-config qt ffmpeg rubberband nlohmann-json rtmidi
      - name: ONNX Runtime
        run: curl -sSL https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-universal2-${ORT_VERSION}.tgz | tar xz -C $HOME
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DLOGGX_ONNXRUNTIME_DIR=$HOME/onnxruntime-osx-universal2-${ORT_VERSION} -DLOGGX_BUILD_NUMBER=${{ github.run_number }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: App-Paket (DMG)
        run: |
          APP="build/app/LoggX Studio.app"
          mkdir -p "$APP/Contents/Frameworks"
          cp -a $HOME/onnxruntime-osx-universal2-${ORT_VERSION}/lib/libonnxruntime*.dylib "$APP/Contents/Frameworks/"
          "$(brew --prefix qt)/bin/macdeployqt" "$APP" -qmldir=app/qml -always-overwrite -libpath="$(brew --prefix)/lib" -libpath="$(brew --prefix)/Frameworks"
          # Fremde Pfade (Homebrew, Build-Rechner) auf das Bundle umbiegen: Abhängigkeiten
          # und eigene Namen als @rpath/…, fremde Suchpfade entfernen
          to_rpath() { case "$1" in *.framework/*) echo "@rpath/${1#*/lib/}" | sed -E 's#^@rpath/.*/([^/]+\.framework/)#@rpath/\1#' ;; *) echo "@rpath/$(basename "$1")" ;; esac; }
          while IFS= read -r f; do
            file "$f" | grep -q Mach-O || continue
            id=$(otool -D "$f" | tail -n +2)
            case "$id" in /opt/homebrew*|/usr/local*) install_name_tool -id "$(to_rpath "$id")" "$f" 2>/dev/null || true ;; esac
            for dep in $(otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -E '^(/opt/homebrew|/usr/local)'); do
              install_name_tool -change "$dep" "$(to_rpath "$dep")" "$f" 2>/dev/null || true
            done
            for rp in $(otool -l "$f" | awk '/LC_RPATH/{getline; getline; print $2}'); do
              case "$rp" in /opt/homebrew*|/usr/local*|/Users/*) install_name_tool -delete_rpath "$rp" "$f" 2>/dev/null || true ;; esac
            done
          done < <(find "$APP" -type f)
          EXE="$APP/Contents/MacOS/LoggX Studio"
          otool -l "$EXE" | grep -q "@executable_path/../Frameworks" || install_name_tool -add_rpath "@executable_path/../Frameworks" "$EXE"
          # Vollversion: KI-Modelle (MIT) mitliefern
          mkdir -p "$APP/Contents/Resources/models"
          base=https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models
          for f in kuielab_a_vocals kuielab_a_drums kuielab_a_bass; do curl -sSL -o "$APP/Contents/Resources/models/$f.onnx" "$base/$f.onnx"; done
          (cd "$APP/Contents/Resources/models" && shasum -a 256 -c - <<'SUMS'
          daba83c2ee1afee9139766ad64c9b6808d6b6f092fff04bed3338be50baac721  kuielab_a_vocals.onnx
          40f586b7091934dd6f5563f0cba8f14bad57ce88440da1098bf388ea716c2901  kuielab_a_drums.onnx
          0c3e77b9963185b1ea6bb46a4b8924137d9370fc1ccdefec7b1b416ef550dcaa  kuielab_a_bass.onnx
          SUMS
          )
          cp third_party/models/LICENSE-kuielab-mdx-net.txt "$APP/Contents/Resources/models/"
          # Name im Finder: LXStudio
          mv "$APP" build/app/LXStudio.app
          # Ad-hoc-Signatur (ohne Apple-Entwicklerkonto): erster Start per Rechtsklick → Öffnen
          codesign --force --deep -s - build/app/LXStudio.app
          mkdir -p dmg && cp -R build/app/LXStudio.app dmg/ && ln -s /Applications dmg/Programme
          VERSION=$(sed -nE 's/^project\(LoggXStudio VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          hdiutil create -volname LXStudio -srcfolder dmg -ov -format UDZO "LXStudio-$VERSION-macOS.dmg"
          # Prüfen: nichts im Paket hängt noch an Homebrew (sonst auf anderen Macs Absturz)
          bad=0
          while IFS= read -r f; do
            file "$f" | grep -q Mach-O || continue
            if otool -L "$f" 2>/dev/null | tail -n +2 | grep -q /opt/homebrew; then
              echo "::error::$f verweist auf Homebrew:"; otool -L "$f" | grep /opt/homebrew; bad=1
            fi
          done < <(find build/app/LXStudio.app -type f)
          test $bad -eq 0
          # Kurztest mit echter Oberfläche (Cocoa); auf CI ohne Bildschirm nur Warnung
          perl -e 'alarm 90; exec @ARGV' build/app/LXStudio.app/Contents/MacOS/"LoggX Studio" --screenshot $RUNNER_TEMP/mac.png --screenshot-delay 1500 || echo "::warning::Starttest ohne Bildschirm nicht möglich"
          ls -la $RUNNER_TEMP/mac.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: LXStudio-macOS
          path: LXStudio-*-macOS.dmg

  windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qtmultimedia'
          cache: true
      - name: vcpkg-Cache laden
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-ffmpeg-rubberband-rtmidi-x64-windows-v3
      - name: FFmpeg und Rubber Band
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vcpkg-cache | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "ffmpeg[core,avcodec,avformat,swscale,swresample,mp3lame,opus,vorbis]:x64-windows" "rubberband:x64-windows" "nlohmann-json:x64-windows" "rtmidi:x64-windows"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: vcpkg-Cache sichern
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-ffmpeg-rubberband-rtmidi-x64-windows-v3
      - name: ONNX Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip" -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath $env:RUNNER_TEMP
          "ONNXRUNTIME_DIR=$env:RUNNER_TEMP\onnxruntime-win-x64-$env:ORT_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Konfigurieren
        shell: pwsh
        run: cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows "-DLOGGX_ONNXRUNTIME_DIR=$env:ONNXRUNTIME_DIR" -DLOGGX_BUILD_NUMBER=${{ github.run_number }}
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: KI-Modelle für die Vollversion
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "models"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $base = "https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models"
          $sums = @{ "kuielab_a_vocals.onnx" = "daba83c2ee1afee9139766ad64c9b6808d6b6f092fff04bed3338be50baac721";
                     "kuielab_a_drums.onnx" = "40f586b7091934dd6f5563f0cba8f14bad57ce88440da1098bf388ea716c2901";
                     "kuielab_a_bass.onnx" = "0c3e77b9963185b1ea6bb46a4b8924137d9370fc1ccdefec7b1b416ef550dcaa" }
          foreach ($f in $sums.Keys) {
            Invoke-WebRequest -Uri "$base/$f" -OutFile (Join-Path $dir $f)
            $h = (Get-FileHash (Join-Path $dir $f) -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $sums[$f]) { throw "Prüfsumme falsch: $f" }
          }
          "LOGGX_MODELS_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Paket bauen
        shell: pwsh
        run: .\installer\windows\package.ps1 -BuildDir build -QtDir $env:QT_ROOT_DIR -VcpkgInstalled "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"

      # Das fertige Paket ohne Qt- und vcpkg-Pfade starten, damit fehlende
      # DLLs oder QML-Module auffallen.
      - name: Paket prüfen
        shell: pwsh
        run: |
          $app = "dist\LoggX Studio"
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH, Env:QT_ROOT_DIR -ErrorAction SilentlyContinue
          $env:QT_QUICK_BACKEND = "software"

          # Engine-Test mit genau den DLLs aus dem Paket (Dekodieren, Pitch/Tempo, Export)
          Copy-Item build\Release\test_render.exe $app
          & "$app\test_render.exe"
          $code = $LASTEXITCODE
          Remove-Item "$app\test_render.exe"
          if ($code -ne 0) { throw "Engine-Test im Paket fehlgeschlagen" }

          # Oberfläche starten und ein Bildschirmfoto speichern
          $shot = Join-Path $PWD "dist\screenshot-windows.png"
          $p = Start-Process -FilePath "$app\LoggX Studio.exe" -ArgumentList "--screenshot", "`"$shot`"" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "Programm reagiert nicht" }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $shot)) { throw "Programm startet nicht (Exit-Code $($p.ExitCode))" }
          Write-Host "Oberfläche gestartet, Bildschirmfoto gespeichert"

      - uses: actions/upload-artifact@v4
        with:
          name: LoggX-Studio-Windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/screenshot-windows.png
          if-no-files-found: error

  release:
    # Jeder erfolgreiche Push auf prototyp/main wird ein Release zum Herunterladen
    # (Windows-Setup, portables ZIP, macOS-DMG). Die App findet es über die
    # Update-Prüfung. Tags v* werden wie bisher veröffentlicht.
    # macOS-Runner sind bei GitHub manchmal nicht verfügbar → Release trotzdem
    # (dann ohne DMG), solange Linux-Tests und Windows erfolgreich waren.
    if: always() && needs.linux.result == 'success' && needs.windows.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/prototyp' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LoggX-Studio-Windows
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LXStudio-macOS
          path: dist
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/^project\(LoggXStudio VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="v$VERSION-build.${{ github.run_number }}"; fi
          {
            echo "## LXStudio $VERSION (Build ${{ github.run_number }})"
            echo
            echo "**Download:** Windows → \`LXStudio-$VERSION-Windows-Setup.exe\` (Vollversion mit KI-Modellen) · macOS → \`LXStudio-$VERSION-macOS.dmg\` (beim ersten Start Rechtsklick → Öffnen)"
            echo
            echo "Installierte Versionen melden das Update von selbst (Einstellungen → Allgemein → Updates)."
            echo
            echo "### Änderungen"
            git log -1 --pretty=format:'%B' | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/N;/^\n$/D'
          } > notes.md
          ls -la dist
          shopt -s nullglob
          gh release create "$TAG" dist/*.exe dist/*.zip dist/*.dmg --title "LXStudio $VERSION (Build ${{ github.run_number }})" \
            --notes-file notes.md --target "$GITHUB_SHA" --latest
          # Nur die letzten 8 automatischen Builds behalten
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[] | select(.tag_name | test("-build\\.")) | .tag_name' | tail -n +9 | while read -r old; do
            gh release delete "$old" --yes --cleanup-tag || true
          done
